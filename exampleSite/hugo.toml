baseURL = "https://example.com"
locale = "en-US"
title = "Noteworthy"
theme = "noteworthy"
enableRobotsTXT = true
summaryLength = 10 # Configure how long the post summary should be on the homepage.

[pagination]
  pagerSize = 4 # Set the number of posts to show before overflowing to the next page.

[services]
  # Add your Google Analytics identifier (GA4): G-XXXXXXXXXX
  [services.googleAnalytics]
    id = ""
  # Add your Disqus shortname here.
  [services.disqus]
    shortname = ""

[taxonomies]
  tag = "tags"

[author]
    name = "kimcc"

# Set to false to disallow raw HTML in markdown files
[markup.goldmark.renderer]
    unsafe = true

# Pass LaTeX through untouched so the theme can render it with KaTeX at build time.
[markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

[params]
    # Load the KaTeX styles on list pages too, for math that appears in summaries.
    math = true

    # Color scheme used until the visitor picks one: "light", "dark", or "auto" (follow the OS).
    defaultTheme = "light"
    # Blog description at the top of the homepage. Supports markdown.
    description = "Noteworthy is a minimalist Hugo theme, perfect for writers and bloggers."

    showReadMore = false

    # Custom fonts: Override CSS variables in assets/css/custom.scss
    # Place font files in your site's static/fonts/ directory

    # Default Open Graph image used when a page does not specify its own image.
    # defaultOgImage = "images/og-default.png"

    # Set enableKofi to true to enable the Ko-fi support button. Add your Ko-fi ID to link to your account.
    enableKofi = false
    kofi = ""

    # Add links to your accounts. Remove the ones you don't want to include.
    # Main
    email = "#"
    facebook = "#"
    twitter = "#"
    instagram = "#"
    tumblr = "#"
    reddit = "#"
    pinterest = "#"
    youtube = "#"
    vimeo = "#"
    weibo = "#"
    vk = "#"
    linkedin = "#"

    # Writing
    medium = "#"
    blogger = "#"
    wordpress = "#"

    # Creative & Visual
    dribbble = "#"
    behance = "#"
    deviantart = "#"
    flickr = "#"

    # Audio & Music
    soundcloud = "#"

    # Programming
    github = "#"
    stackoverflow = "#"
    gitlab = "#"
    codepen = "#"

    # Academic
    googlescholar = "#"
    impactstory = "#"
    orcid = "#"

    # Travel
    googlemaps = "#"
    tripadvisor = "#"

# Menu links along the sidebar navigation.
[[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 1 # Weight is an integer used to sort the menu items. The sorting goes from smallest to largest numbers. If weight is not defined for each menu entry, Hugo will sort the entries alphabetically.

[[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 2

[[menu.main]]
    name = "Archives"
    identifier = "archives"
    url = "/archives/"
    weight = 3

# Privacy configurations: https://gohugo.io/configuration/privacy/
[privacy]
  [privacy.disqus]
    disable = false
  [privacy.googleAnalytics]
    disable = false
    respectDoNotTrack = true
  [privacy.instagram]
    disable = false
  [privacy.x]
    disable = false
    enableDNT = true
    simple = false
  [privacy.vimeo]
    disable = false
    enableDNT = true
    simple = false
  [privacy.youtube]
    disable = false
    privacyEnhanced = true
