name: Build exampleSite

on:
  push:
    branches: [master]
  pull_request:
  # Monthly run against the latest Hugo to catch new deprecations early.
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Hugo ${{ matrix.hugo }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open an issue when the scheduled run fails
    strategy:
      fail-fast: false
      matrix:
        # min_version in theme.toml, and the latest release
        hugo: ["0.158.0", "latest"]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check min_version matches the matrix
        if: matrix.hugo != 'latest'
        run: grep -qx 'min_version = "${{ matrix.hugo }}"' theme.toml

      - name: Install Hugo
        run: |
          version="${{ matrix.hugo }}"
          if [ "$version" = latest ]; then
            version=$(gh release view --repo gohugoio/hugo --json tagName --jq '.tagName | ltrimstr("v")')
          fi
          echo "HUGO_VERSION=$version" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"
          # The theme needs no Sass, so the standard (non-extended) build is enough.
          tarball="hugo_${version}_linux-amd64.tar.gz"
          gh release download "v$version" --repo gohugoio/hugo --pattern "$tarball" --pattern "hugo_${version}_checksums.txt"
          grep " ${tarball}\$" "hugo_${version}_checksums.txt" | sha256sum --check
          mkdir -p hugo && tar -xzf "$tarball" -C hugo hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Build exampleSite
        run: |
          hugo version
          mkdir -p "$RUNNER_TEMP/themes"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/themes/noteworthy"
          set -o pipefail
          hugo build --source exampleSite --themesDir "$RUNNER_TEMP/themes" --theme noteworthy \
            --destination "$RUNNER_TEMP/public" --cacheDir "$RUNNER_TEMP/cache" \
            --logLevel warn --printPathWarnings --printUnusedTemplates 2>&1 | tee build.log

      - name: Fail on warnings and errors
        run: |
          grep 'is unused' build.log > unused-templates.txt || true
          if grep -E '^(WARN|ERROR)' build.log | grep -v 'is unused'; then
            echo "::error::Hugo ${HUGO_VERSION} reported warnings or errors (see above)"
            exit 1
          fi
          if [ -s unused-templates.txt ]; then
            echo "::warning::Unused templates found (see the unused-templates artifact)"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log-hugo-${{ matrix.hugo }}
          path: |
            build.log
            unused-templates.txt
          if-no-files-found: ignore

      - name: Open an issue when the scheduled build fails
        if: failure() && github.event_name == 'schedule'
        run: |
          title="ci: scheduled exampleSite build failed with Hugo ${HUGO_VERSION:-${{ matrix.hugo }}}"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "An open issue already exists"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
            --body "The monthly build failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
